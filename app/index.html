<style>
/* The app shell: one frame per module (simulator, training, later lessons, pacemaker, ...) and the module tabs.
   The tabs sit over the left of the module's own header (the module leaves --tabs-w free there), so the module
   keeps its phone layout and its own buttons on the right. Active tab: icon and name, first; the others follow
   in a fixed order, icon only on phones and named on tablets. The logo stays at the far left. The frames are inset by the system bars, so the
   modules see none. */
:root {
  --bg: #0b131a; --surface: #121d27; --raised: #1b2834; --fg: #e3eaf0; --muted: #93a3b1; --line: #24323f; --accent: #ef5b7a;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --bar-h: 50px;
  /* system bars: the Android app's values (Capacitor SystemBars, insetsHandling "css"), else the browser's */
  --in-t: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); --in-b: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --in-l: var(--safe-area-inset-left, env(safe-area-inset-left, 0px)); --in-r: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
* { -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; top: var(--in-t); bottom: var(--in-b); left: var(--in-l); right: var(--in-r); }
#stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); visibility: hidden; }
#stage iframe.on { visibility: visible; }
#tabs { position: fixed; z-index: 10; top: var(--in-t); left: var(--in-l); height: var(--bar-h);
  display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px; transition: opacity 0.15s; }
#tabs .mark { display: flex; margin-right: 4px; }
#tabs .mark .logo { width: 26px; height: 26px; }
#tabs.off { opacity: 0; pointer-events: none; }
#tabs button { all: unset; box-sizing: border-box; height: 38px; min-width: 38px; padding: 0 9px; border-radius: 19px; display: flex; align-items: center; justify-content: center; gap: 7px;
  color: var(--muted); cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#tabs svg { width: 21px; height: 21px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabs .name { font: 600 17px/1 var(--font-display); letter-spacing: 0.01em; white-space: nowrap; display: none; }
#tabs button.on { background: var(--raised); border: 1px solid #33434f; padding: 0 13px 0 10px; color: var(--fg); }
#tabs button.on svg { color: var(--accent); }
#tabs button.on .name { display: inline; }
#tabs button:not(.on):active { background: rgba(255,255,255,0.07); }
/* the interactive tutorial (src/tutorial.js) points at a tab */
#tabs button.tour { color: var(--fg); box-shadow: 0 0 0 2px var(--accent); animation: tourPulse 1.4s ease-in-out infinite; }
#tabs button.tour svg { color: var(--accent); }
@keyframes tourPulse { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 9px rgba(239,91,122,0.22); } }
@media (prefers-reduced-motion: reduce) { #tabs button.tour { animation: none; } }
/* narrow phones (or a large system font): the open tab shows its icon only, so the module's own buttons (⋯ included)
   keep their room on the right */
@media (max-width: 379px) {
  #tabs button.on .name { display: none; }
  #tabs button.on { padding: 0 10px; }
  #tabs { gap: 2px; padding-left: 6px; }
}
/* tablets: every tab named */
@media (min-width: 600px) {
  #tabs button .name { display: inline; font-size: 16px; }
  #tabs button:not(.on) { padding: 0 12px 0 10px; }
}
</style>
</head>

ts="354.4,278.7 315.0,301.5 315.0,346.9 354.4,324.2" fill="#2f6bff"/><polygon points="275.7,187.8 315.0,210.5 275.7,233.3 236.3,210.5" fill="#a5c0ff"/><polygon points="315.0,210.5 275.7,233.3 275.7,278.7 315.0,256.0" fill="#7aa2ff"/><polygon points="315.0,210.5 354.4,233.3 354.4,278.7 315.0,256.0" fill="#2049ad"/><polygon points="393.8,210.5 354.4,233.3 354.4,278.7 393.8,256.0" fill="#2f6bff"/><polygon points="315.0,119.6 354.4,142.4 315.0,165.1 275.7,142.4" fill="#729aff"/><polygon points="275.7,142.4 315.0,165.1 315.0,210.5 275.7,187.8" fill="#2049ad"/><polygon points="354.4,51.5 393.8,74.2 354.4,96.9 315.0,74.2" fill="#f8c0d2"/><polygon points="315.0,74.2 354.4,96.9 354.4,142.4 315.0,119.6" fill="#a66f81"/><polygon points="393.8,74.2 354.4,96.9 354.4,142.4 393.8,119.6" fill="#f4a3bd"/><polygon points="118.2,369.6 157.6,392.4 157.6,437.8 118.2,415.1" fill="#536ead"/><polygon points="197.0,369.6 157.6,392.4 157.6,437.8 197.0,415.1" fill="#7aa2ff"/><polygon points="236.3,301.5 197.0,324.2 197.0,369.6 236.3,346.9" fill="#7aa2ff"/><polygon points="275.7,233.3 236.3,256.0 236.3,301.5 275.7,278.7" fill="#7aa2ff"/><polygon points="197.0,142.4 236.3,165.1 197.0,187.8 157.6,165.1" fill="#8bcfd8"/><polygon points="354.4,142.4 393.8,165.1 354.4,187.8 315.0,165.1" fill="#729aff"/><polygon points="315.0,165.1 354.4,187.8 354.4,233.3 315.0,210.5" fill="#2049ad"/><polygon points="393.8,165.1 354.4,187.8 354.4,233.3 393.8,210.5" fill="#2f6bff"/><polygon points="39.5,324.2 78.9,346.9 78.9,392.4 39.5,369.6" fill="#3a7e86"/><polygon points="197.0,324.2 157.6,346.9 157.6,392.4 197.0,369.6" fill="#55b9c5"/><polygon points="236.3,256.0 197.0,278.7 197.0,324.2 236.3,301.5" fill="#55b9c5"/><polygon points="236.3,165.1 275.7,187.8 236.3,210.5 197.0,187.8" fill="#8bcfd8"/><polygon points="275.7,187.8 236.3,210.5 236.3,256.0 275.7,233.3" fill="#55b9c5"/><polygon points="78.9,346.9 118.2,369.6 118.2,415.1 78.9,392.4" fill="#3a7e86"/><polygon points="157.6,346.9 118.2,369.6 118.2,415.1 157.6, <div id="stage"></div>
<script>
(function () {
  // the modules, in their fixed order (url: filled in by tools/build.py for the preview or the app build)
  const URLS = {"simulator": "../index.html?app", "training": "../training/index.html?app"};
  const ICONS = {
    // heart with a trace through it
    simulator: '<path d="M12 20.5s-7.5-4.6-8.9-9.6C2.2 7.7 4.2 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 3.1 0 5.1 3.2 4.2 6.4-1.4 5-8.9 9.6-8.9 9.6z"/><path d="M3.4 12.2h4.4l1.6-3 2.4 6 1.8-3.8h6.9"/>',
    // mortarboard
    training: '<path d="M2.5 9.2 12 4.8l9.5 4.4L12 13.6z"/><path d="M6.5 11.2v4.4c0 1.4 2.5 3 5.5 3s5.5-1.6 5.5-3v-4.4"/><path d="M21.5 9.2v5.3"/>',
  };
  const MODULES = [
    { id: 'simulator', name: 'Simulator' },
    { id: 'training', name: 'Training' },
  ].map((m) => Object.assign(m, { url: URLS[m.id] }));
  const BY = Object.fromEntries(MODULES.map((m) => [m.id, m]));
  const KEY = 'ecgApp.module';
  const tabs = document.getElementById('tabs'), stage = document.getElementById('stage');
  const btn = {}, frame = {}, chrome = {}, ready = {};
  // the interactive tutorial: Training prepares its ECG while the simulator's steps run (prep), the Training tab is
  // ringed (ring) until it is tapped, then Training takes over (train)
  const tour = { prep: false, ring: null };
  let current = null;
  const store = { get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }, set(v) { try { localStorage.setItem(KEY, v); } catch (e) { /* private mode */ } } };

  for (const m of MODULES) {
    const b = btn[m.id] = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = m.id; b.setAttribute('aria-label', m.name);
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[m.id] || ''}</svg><span class="name">${m.name}</span>`;
    b.addEventListener('click', () => open(m.id));
    tabs.appendChild(b);
  }

  function post(id, type, data) { const f = frame[id]; if (f && f.contentWindow) f.contentWindow.postMessage(Object.assign({ ecgApp: type }, data || {}), '*'); }
  function tabsWidth() { return Math.ceil(tabs.getBoundingClientRect().width) + 2; }
  function sendWidth() { const w = tabsWidth(); for (const id in frame) post(id, 'tabs', { w }); }
  function syncChrome() { tabs.classList.toggle('off', chrome[current] === false); }

  function load(id, hash) {
    let f = frame[id];
    const url = BY[id].url + (hash ? `#${hash}` : '');
    if (!f) {
      f = frame[id] = document.createElement('iframe');
      f.title = BY[id].name; f.allow = 'clipboard-write; fullscreen; web-share';
      f.src = url; stage.appendChild(f);
    } else if (hash) {
      f.src = url;   // (only the #scenario changes; the simulator reloads on a new scenario link)
    }
    return f;
  }

  // switch module: the tapped tab moves to the front and shows its name (animated from where each tab was)
  function open(id, hash) {
    if (!BY[id]) id = MODULES[0].id;
    const prev = current;
    if (id === prev && !hash) { post(id, 'reselect'); return; }   // (the showing module's tab again: back to its start)
    const before = new Map(MODULES.map((m) => [m.id, btn[m.id].getBoundingClientRect().left]));
    current = id; store.set(id);
    for (const m of [BY[id], ...MODULES.filter((x) => x.id !== id)]) tabs.appendChild(btn[m.id]);
    for (const m of MODULES) { btn[m.id].classList.toggle('on', m.id === id); btn[m.id].setAttribute('aria-selected', String(m.id === id)); }
    if (prev && prev !== id && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      for (const m of MODULES) {
        const dx = before.get(m.id) - btn[m.id].getBoundingClientRect().left;
        if (Math.abs(dx) > 0.5) btn[m.id].animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
      }
      const n = btn[id].querySelector('.name');
      n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
    }
    load(id, hash);
    for (const m of MODULES) if (frame[m.id]) frame[m.id].classList.toggle('on', m.id === id);
    if (prev && prev !== id) post(prev, 'hide');
    post(id, 'show');
    if (tour.ring && tour.ring === id) { btn[id].classList.remove('tour'); tour.ring = null; post(id, 'tour', { step: 'train' }); }
    sendWidth(); syncChrome();
  }

  addEventListener('message', (e) => {
    const d = e.data;
    if (!d || !d.ecgApp) return;
    const id = Object.keys(frame).find((k) => frame[k].contentWindow === e.source);
    if (!id) return;
    if (d.ecgApp === 'ready') { ready[id] = true; sendEnts(id); if (id === 'training' && tour.prep) post(id, 'tour', { step: 'prep' }); post(id, 'tabs', { w: tabsWidth() }); post(id, id === current ? 'show' : 'hide'); if (SharePlugin && FsPlugin) post(id, 'caps', { share: true }); }
    if (d.ecgApp === 'share') share(id, d);
    if (d.ecgApp === 'buy') buy(id, d);
    if (d.ecgApp === 'restore') restore(id);
    if (d.ecgApp === 'open' && /^https:\/\//.test(d.url || '')) { if (AppPlugin) location.href = d.url; else window.open(d.url, '_blank', 'noopener'); }   // (an outside link: in the app, Capacitor hands the page's own navigation to the phone's browser)
    if (d.ecgApp === 'tour') {
      if (d.step === 'prep' && BY.training) { tour.prep = true; load('training'); if (ready.training) post('training', 'tour', { step: 'prep' }); }
      if (d.step === 'ring' && BY[d.module]) {
        if (tour.ring) btn[tour.ring].classList.remove('tour');
        tour.ring = d.module; btn[d.module].classList.add('tour');
        const r = btn[d.module].getBoundingClientRect(), s = stage.getBoundingClientRect();   // (in the module's frame)
        post(id, 'tour', { step: 'rect', x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height });
      }
      if (d.step === 'end') { if (tour.ring) btn[tour.ring].classList.remove('tour'); tour.ring = null; tour.prep = false; }
    }
    if (d.ecgApp === 'chrome') { chrome[id] = !!d.on; syncChrome(); }
    if (d.ecgApp === 'go' && BY[d.module]) open(d.module, typeof d.hash === 'string' ? d.hash : '');
    if (d.ecgApp === 'back' && id === current && back.wait) { clearTimeout(back.wait); back.wait = 0; if (!d.handled) back.leave(); }
  });

  // Android back button (in the app): the showing module closes what is open (menu, page, full-screen view) or goes
  // to its start; when it has nothing to close, the app goes to the background (keeping its state)
  const CAP = window.Capacitor, AppPlugin = CAP && CAP.isNativePlatform && CAP.isNativePlatform() && (CAP.Plugins.App || (CAP.registerPlugin && CAP.registerPlugin('App')));
  const back = { wait: 0, leave() { if (AppPlugin) AppPlugin.minimizeApp(); } };
  // sharing from a module (src/inapp.js): files are written to the app's cache, then the system share sheet
  const plugin = (n) => CAP && CAP.isNativePlatform && CAP.isNativePlatform() && (CAP.Plugins[n] || (CAP.registerPlugin && CAP.registerPlugin(n)));
  const SharePlugin = plugin('Share'), FsPlugin = plugin('Filesystem');
  // Google Play billing (docs/PREMIUM_PLAN.md): one-time products, by module id → Play product id. The shell owns the
  // purchases; the modules get what this Google account owns ('ents', with the local prices), and ask to buy ('buy') or
  // to restore ('restore'). What is owned is kept on the phone too, for starts without a connection. A debug build
  // (the marker file app/android/app/src/debug/assets/public/dev-unlock.json, absent from Play builds) owns everything.
  const PRODUCTS = { training: 'training' };
  const Billing = plugin('NativePurchases'), ENT_KEY = 'ecgApp.ents';
  const shop = { billing: !!Billing, dev: false, prices: {}, ents: (() => { try { return JSON.parse(localStorage.getItem(ENT_KEY)) || {}; } catch (e) { return {}; } })() };
  const entsMsg = () => ({ billing: shop.billing, dev: shop.dev, prices: shop.prices, ents: shop.dev ? Object.fromEntries(Object.keys(PRODUCTS).map((k) => [k, true])) : shop.ents });
  function sendEnts(id) { if (id) post(id, 'ents', entsMsg()); else for (const k in frame) post(k, 'ents', entsMsg()); }
  async function refreshEnts() {
    if (!Billing) return;
    try {
      const { purchases } = await Billing.getPurchases({ productType: 'inapp' });
      const owned = new Set((purchases || []).filter((x) => String(x.purchaseState) === '1').map((x) => x.productIdentifier));   // (1: purchased; 2: pending payment)
      for (const [k, pid] of Object.entries(PRODUCTS)) shop.ents[k] = owned.has(pid);
      try { localStorage.setItem(ENT_KEY, JSON.stringify(shop.ents)); } catch (e) { /* private mode */ }
    } catch (e) { /* offline: what was owned last time stands */ }
    sendEnts();
  }
  async function loadPrices() {
    try {
      const { products } = await Billing.getProducts({ productIdentifiers: Object.values(PRODUCTS), productType: 'inapp' });
      for (const x of products || []) { const k = Object.keys(PRODUCTS).find((m) => PRODUCTS[m] === x.identifier); if (k && x.priceString) shop.prices[k] = x.priceString; }
      sendEnts();
    } catch (e) { /* no prices yet (no connection, or the product is not set up in the Play Console) */ }
  }
  async function buy(id, d) {
    const pid = PRODUCTS[d.product];
    if (!Billing || !pid) { post(id, 'bought', { product: d.product, ok: false, err: 'Purchases are not available here' }); return; }
    try {
      await Billing.purchaseProduct({ productIdentifier: pid, productType: 'inapp' });   // (acknowledged by the plugin)
      await refreshEnts();
      post(id, 'bought', { product: d.product, ok: !!shop.ents[d.product], pending: !shop.ents[d.product] });
    } catch (e) {
      const msg = String((e && e.message) || e);
      post(id, 'bought', { product: d.product, ok: false, cancelled: /cancel/i.test(msg), err: msg });
      refreshEnts();   // (an "already owned" error: the purchase exists, so restore it)
    }
  }
  async function restore(id) {
    if (Billing) { try { await Billing.restorePurchases(); } catch (e) { /* listed below anyway */ } }
    await refreshEnts();
    post(id, 'restored', entsMsg());
  }
  async function share(id, d) {
    try {
      const files = [];
      for (const f of d.files || []) files.push((await FsPlugin.writeFile({ path: f.name, data: f.data, directory: 'CACHE' })).uri);
      const opt = {};
      if (d.title) opt.title = d.title;
      if (d.text) opt.text = d.text;
      if (d.url) opt.url = d.url;
      if (files.length) opt.files = files;
      await SharePlugin.share(opt);
      post(id, 'shared', { id: d.id, ok: true });
    } catch (e) {
      const msg = String((e && e.message) || e);
      post(id, 'shared', { id: d.id, ok: false, abort: /cancel/i.test(msg), err: msg });
    }
  }
  function onBack() {
    if (back.wait) return;
    if (!frame[current]) { back.leave(); return; }
    back.wait = setTimeout(() => { back.wait = 0; back.leave(); }, 600);   // (a module still loading does not answer)
    post(current, 'back');
  }
  if (AppPlugin) AppPlugin.addListener('backButton', onBack);
  if (Billing) {
    fetch('dev-unlock.json', { cache: 'no-store' }).then((r) => { if (r.ok) { shop.dev = true; sendEnts(); } }).catch(() => {});
    refreshEnts(); loadPrices();
    if (AppPlugin) AppPlugin.addListener('resume', refreshEnts);   // (a purchase finished or refunded while away)
  }
  addEventListener('resize', sendWidth);
  if (document.fonts) document.fonts.ready.then(sendWidth);   // (the tab names are wider once the font is in)

  window.ECGAppShell = { open, onBack, MODULES, frame, get current() { return current; } };   // (automated tests)
  open(store.get() || MODULES[0].id);
})();
</script>
