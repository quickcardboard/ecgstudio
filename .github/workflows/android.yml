# The Android app (app/, Capacitor): a debug APK on every push to app-1 that touches the app or the pages.
# Download it from the run's page (Artifacts: ecgstudio-debug-apk), unzip, and install on a phone.
name: Android app
on:
  push:
    branches: [app-1]
    paths: ['app/**', 'src/**', 'vendor/**', 'icons/**', 'tools/build.py', 'tools/reader.js', 'tools/rhythmread.js', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install the app's packages
        working-directory: app
        run: npm ci
      - name: Build the pages and app/www
        run: python3 tools/build.py --app
      - name: Copy the web build into the Android project
        working-directory: app
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ecgstudio-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
